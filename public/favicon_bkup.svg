<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
    <!-- 左侧图标（圆角方形底） -->
    <rect x="8" y="8" width="64" height="64" rx="16" fill="#F97316"/>

    <!-- 抽象Y -->
    <line x1="26" y1="26" x2="44" y2="50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="54" y1="26" x2="36" y2="50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="52" x2="40" y2="66" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- 右侧文字 Yuzumi -->
    <text x="90" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#1E293B" letter-spacing="2.5">Yuzumi</text>
